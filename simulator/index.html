<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WoS Util battle simulator for Whiteout Survival, in development."
    />
    <title>WoS Util · Battle Simulator</title>
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('wosutil:theme')
          const dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch {
          // Storage or matchMedia unavailable: keep the light default.
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/style.css" />
    <script type="module" src="../src/simulator.ts"></script>
  </head>
  <body class="font-primary bg-background text-ink antialiased">
    <div id="app" class="flex min-h-dvh flex-col">
      <main
        class="mx-auto flex w-full max-w-[1440px] flex-1 items-center justify-center px-4 py-16 sm:px-6 lg:px-10 xl:px-[100px]"
      >
        <div class="flex max-w-[34rem] flex-col gap-2 text-center">
          <h1 class="text-h4 font-medium tracking-[-0.01em]">Battle simulator</h1>
          <p class="text-p3 text-ink-muted">In development.</p>
        </div>
      </main>
    </div>
  </body>
</html>
