server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # HTML must revalidate so a new deploy is picked up immediately.
    add_header Cache-Control "no-cache" always;

    # Astro fingerprints every file in /_astro/, so it can be cached forever.
    # Hashed assets must 404 instead of returning the reports shell.
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Report detail URLs are client-side routes; return the reports page so the
    # browser script can open the report from the pathname.
    location / {
        try_files $uri $uri/ /reports/index.html;
    }
}
