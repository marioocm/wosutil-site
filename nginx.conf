server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets must 404 instead of returning the reports shell.
    location /_astro/ {
        try_files $uri =404;
    }

    # Report detail URLs are client-side routes; return the reports page so the
    # browser script can open the report from the pathname.
    location / {
        try_files $uri $uri/ /reports/index.html;
    }
}
