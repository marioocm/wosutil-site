<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="WoS Util countdown timer: set a duration, press play, and track it with a live UTC clock."
    />
    <title>WoS Util · Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../src/style.css" />
    <script type="module" src="../src/main.ts"></script>
  </head>
  <body class="font-primary bg-canvas text-ink antialiased">
    <div class="flex min-h-dvh flex-col">
      <header class="flex items-center justify-between px-6 py-4">
        <div class="flex items-center gap-3">
          <span
            class="inline-block size-3 rounded-full bg-primary"
            aria-hidden="true"
          ></span>
          <h1 class="text-heading-lg font-medium tracking-tight">WoS Util</h1>
        </div>
        <p
          id="utc-clock"
          class="rounded-full border border-hairline bg-canvas-soft px-3 py-1 text-micro tabular-nums text-ink-mute"
        >
          UTC: --:--:--
        </p>
      </header>

      <main class="flex flex-1 flex-col items-center justify-center gap-10 px-6">
        <p class="text-body-md text-ink-mute">Countdown</p>

        <section
          class="flex items-center gap-3 sm:gap-4"
          aria-live="polite"
          aria-label="Countdown"
        >
          <div class="flex min-w-16 flex-col items-center gap-2 rounded-xl bg-canvas-soft px-4 py-5 sm:min-w-24 sm:px-6">
            <span id="minutes" class="text-display-xxl font-medium tabular-nums">00</span>
          </div>
          <span class="text-display-xxl font-medium text-ink-mute" aria-hidden="true">:</span>
          <div class="flex min-w-16 flex-col items-center gap-2 rounded-xl bg-canvas-soft px-4 py-5 sm:min-w-24 sm:px-6">
            <span id="seconds" class="text-display-xxl font-medium tabular-nums">00</span>
          </div>
        </section>

        <section class="flex flex-col items-center gap-4">
          <div class="flex items-center gap-2" role="group" aria-label="Duration">
            <input
              id="minutes-input"
              type="number"
              inputmode="numeric"
              min="0"
              max="99"
              placeholder="MM"
              aria-label="Minutes"
              class="font-primary w-20 rounded-sm border border-hairline bg-canvas px-3 py-2 text-center text-body-md tabular-nums text-ink [color-scheme:light] focus:border-primary-deep focus:outline-none focus:ring-2 focus:ring-primary/25 disabled:opacity-50"
            />
            <span class="text-display-md text-ink-mute" aria-hidden="true">:</span>
            <input
              id="seconds-input"
              type="number"
              inputmode="numeric"
              min="0"
              max="59"
              placeholder="SS"
              aria-label="Seconds"
              class="font-primary w-20 rounded-sm border border-hairline bg-canvas px-3 py-2 text-center text-body-md tabular-nums text-ink [color-scheme:light] focus:border-primary-deep focus:outline-none focus:ring-2 focus:ring-primary/25 disabled:opacity-50"
            />
          </div>
          <div class="flex gap-3">
            <button
              id="play-button"
              class="font-primary rounded-sm bg-primary px-5 py-2 text-button-md font-medium text-on-primary transition-colors hover:bg-primary-deep"
            >
              Play
            </button>
            <button
              id="reset-button"
              class="font-primary rounded-sm border border-hairline-strong bg-canvas px-5 py-2 text-button-md font-medium text-ink transition-colors hover:bg-canvas-soft disabled:cursor-not-allowed disabled:opacity-40"
            >
              Reset
            </button>
            <button
              id="clear-button"
              class="font-primary rounded-sm border border-hairline-strong bg-canvas px-5 py-2 text-button-md font-medium text-ink transition-colors hover:bg-canvas-soft"
            >
              Clear
            </button>
          </div>
        </section>

        <p id="status" class="text-caption text-ink-mute">Set a duration and press play</p>
      </main>

      <footer class="flex justify-center pb-6">
        <a
          href="https://github.com/marioocm/wosutil-site"
          target="_blank"
          rel="noopener noreferrer"
          class="flex items-center gap-2 text-caption text-ink-mute transition-colors hover:text-ink"
        >
          <svg
            viewBox="0 0 16 16"
            width="16"
            height="16"
            fill="currentColor"
            aria-hidden="true"
            class="shrink-0 -translate-y-px"
          >
            <path
              d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
            />
          </svg>
          WoS-Util
        </a>
      </footer>
    </div>
  </body>
</html>
