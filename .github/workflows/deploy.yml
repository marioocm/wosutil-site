name: Deploy to PC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pc
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Windows, X64, wos-pc]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          SITE_URL: https://wosutil.mariocm.dev
          BASE_PATH: /
          PUBLIC_SIM_API: /sim
      - name: Copy dist to the live Caddy volume
        shell: pwsh
        run: |
          $target = "C:\Users\mario\Documents\Proyectos\PythonWOS\wosutil-sim\deploy\web"
          if (-not (Test-Path -LiteralPath $target)) {
            throw "Missing live web directory: $target"
          }
          Get-ChildItem -LiteralPath $target -Force | Remove-Item -Recurse -Force
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "dist\*") -Destination $target -Recurse -Force

          $ok = $false
          for ($i = 0; $i -lt 12; $i++) {
            try {
              $response = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8080/reports/" -TimeoutSec 5
              if ($response.StatusCode -eq 200) {
                $ok = $true
                break
              }
            } catch {
              Start-Sleep -Seconds 5
            }
          }
          if (-not $ok) {
            throw "Caddy did not return 200 for /reports/ after deploy"
          }
